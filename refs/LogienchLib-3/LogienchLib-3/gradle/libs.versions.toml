[versions]
kotlin = "2.1.21"
avaje-inject = "12.5"

paper-api = "1.20.6-R0.1-SNAPSHOT"
velocity-api = "3.5.0-SNAPSHOT"

floodgate = "2.2.5-SNAPSHOT"
protocollib = "5.1.0"
hikaricp = "5.0.1"
nbt-api = "2.15.2"
leveldb-api = "1.0.1"
leveldb = "1.0.1"
cloudburstmc-nbt = "3.0.0.Final"
boosted-yaml = "1.3.7"

shadow = "8.3.0"
run-server = "3.0.2"
#foojay = "0.10.0"

# ─── テスト ───
# JUnit 5系（バージョン番号は5.x.xのため変数名 junit5 は正しい）
junit5 = "5.11.0"
# JUnit Platform（junit5 5.11.0 と対応するバージョン 1.11.0）
junit-platform = "1.11.0"
# MockBukkit: paper-api 1.20.6 に对応するバージョン（com.github.seeseemelk グループ）
mockbukkit = "3.37.0"
mockk = "1.14.0"

[libraries]
# ─── プラットフォーム API ───
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
protocollib = { module = "net.dmulloy2:ProtocolLib", version.ref = "protocollib" }

# ─── データベース ───
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

# ─── NBT / データ操作 ───
nbt-api = { module = "de.tr7zw:item-nbt-api", version.ref = "nbt-api" }
leveldb-api = { module = "com.hivemc.leveldb:leveldb-api", version.ref = "leveldb-api" }
leveldb = { module = "com.hivemc.leveldb:leveldb", version.ref = "leveldb" }
cloudburstmc-nbt = { module = "org.cloudburstmc:nbt", version.ref = "cloudburstmc-nbt" }
boosted-yaml = { module = "dev.dejvokep:boosted-yaml", version.ref = "boosted-yaml" }

# ─── DI フレームワーク ───
avaje-inject = { module = "io.avaje:avaje-inject", version.ref = "avaje-inject" }
avaje-inject-generator = { module = "io.avaje:avaje-inject-generator", version.ref = "avaje-inject" }

# ─── テスト ───
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
# MockBukkit v1.20: paper-api 1.20.6 に対応 ただし下手にアップデートするとjunitのバージョンがずれてエラーになるので注意
mockbukkit = { module = "com.github.seeseemelk:MockBukkit-v1.20", version.ref = "mockbukkit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-server" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-server" }
#foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
