#================================================
# ShardLib Attributes
#================================================
#
# ここでは、全てのエンティティが持つ能力値（ステータス）を定義します。
# ステータスには、他の値に依存しない「基本ステータス」と、
# 他のステータスから計算される「派生ステータス」があります。
#
# キー: 属性のユニークID (例: "vitality")
#
#   formula: (任意) この属性値を計算するための数式。
#            指定しない場合、この属性は他の値から計算されない「基本ステータス」となります。
#            利用可能な変数: 他の全ての属性ID、プレイヤーレベル(`player_level`)など。
#   default: (任意) この属性値のデフォルトの値となる数値。
#            指定しない場合、0がデフォルトの値となります。
#
#================================================


