#================================================
# ShardLib MobAttributes
#================================================
#
# ここでは、モブが持つ全ての能力値（ステータス）を定義します。
# このファイル名がidとなり、モブを作成する際に指定することになります。
#
# ステータスを新規で追加する場合
# キー: 属性のユニークID (例: "vitality")
#
#   formula: (任意) この属性値を計算するための数式。
#            指定しない場合、この属性は他の値から計算されない「基本ステータス」となります。
#            利用可能な変数: 他の全ての属性ID、プレイヤーレベル(`player_level`)など。
#   default: (任意) この属性値のデフォルトの値となる数値。
#            指定しない場合、0がデフォルトの値となります。
#
# 既存のステータスを上書きする場合。ここでの上書きはこのステータスにしか適応されません。
# 上書きするキー: ShardLib/attribute/ で宣言したステータスのキー (例: "vitality")
#
#   formula: (任意) この属性値を計算するための数式。
#            nullもしくは""場合、この属性は他の値から計算されない「基本ステータス」となります。
#            利用可能な変数: 他の全ての属性ID、プレイヤーレベル(`player_level`)など。
#   default: (任意) この属性値のデフォルトの値となる数値。
#            指定しない場合、0がデフォルトの値となります。
#
#================================================


