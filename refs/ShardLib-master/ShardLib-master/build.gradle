plugins {
    id 'java-library'
    id 'maven-publish'
    id("io.github.goooler.shadow") version "8.1.7"
}

group = 'net.logiench'
version = '1.3.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Logiench/LogienchLib-v2-2")
        credentials {
            // gradle.propertiesから認証情報を読み込む設定
            username = project.findProperty("GITHUB_ACTOR") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT")
    compileOnly("Logiench:logienchlib:2.2.5")
    // https://mvnrepository.com/artifact/net.objecthunter/exp4j
    api("net.objecthunter:exp4j:0.4.8")

    // Guice
    api("com.google.inject:guice:7.0.0")
//    implementation('com.google.inject.extensions:guice-assistedinject:7.0.0') // FactoryModuleBuilder
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register('apiJar', Jar) {
    // 生成されるjarファイルの名前に "-api" を付けます (例: ShardLib-1.0-SNAPSHOT-api.jar)
    archiveClassifier = 'api'

    // コンパイルされたクラスファイル（.class）を元にjarを作成します
    from sourceSets.main.output

    // "net/logiench/shardLib/api/" パッケージ以下のクラスのみをjarに含めます
    // ** これがAPIのみを抽出するキモの部分です **
    include 'net/logiench/shardLib/api/**'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.unset()
    dependsOn(sourcesJar/*, apiJar*/)
}

publishing {
    publications {
        create('gpr', MavenPublication) {
            // 1. 基本情報を設定
            groupId = "Logiench"
            artifactId = "shardlib"
            version = project.version
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Logiench/ShardLib")
            credentials {
                // gradle.propertiesから認証情報を読み込む設定
                username = project.findProperty("GITHUB_ACTOR") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}