name: attributelib
version: '$version'

main: DIV.attributelib.Attributelib
api-version: '26.1.2'
load: POSTWORLD
softdepend: [PlaceholderAPI]

commands:
  sideboard:
    description: ステータスサイドバーの表示設定
    permission: attributelib.sideboard
    usage: |
      /sideboard <ジャンル1> [ジャンル2] [ジャンル3] - 選択順に上から表示
      /sideboard on/off - 表示の切り替え(選択は記憶される)
  attributelib:
    aliases: [alib]
    description: attributelib デバッグコマンド
    permission: attributelib.debug
    usage: |
      /alib list - 登録済み属性の一覧
      /alib dump - 視線の先(いなければ自分)の属性状態
      /alib setbase <ns:id> <value>
      /alib add <ns:id> <ADD|MULTIPLY|SET> <value> [durationTicks]
      /alib clear - デバッグ由来モディファイアの除去
      /alib item [<ns:id> <ADD|MULTIPLY|SET> <value> [slot]] - 手持ちアイテムの属性表示/追加
      /alib itemclear - 手持ちアイテムのカスタム属性を全除去
      /alib smoke - 自己診断(コンソール可)

permissions:
  attributelib.debug:
    description: attributelib のデバッグコマンドを使用できる
    default: op
  attributelib.sideboard:
    description: ステータスサイドバーを表示できる
    default: true
