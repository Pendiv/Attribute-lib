# attributelib 設定ファイル
#
# 注意: 既存サーバーの config.yml は自動では上書きされません。新しいキーを反映したい場合は
#       手で追記するか、このファイルを一度削除して再生成してください。

# ─────────────────────────────────────────────────────────────────────
# バニラ属性のハード上限解放
# ─────────────────────────────────────────────────────────────────────
# Mojang がコードに焼き込んだ上限(最大体力 1024・防御力 30 など)を引き上げます。
# ここで指定した値まで、モディファイアで届かせれば最終値が許容されるようになります。
# キーは属性のキー名(ハイフン/アンダースコア どちらでも可)。現上限より小さい値は無視されます。
#
# よく使う既定上限: max_health=1024, armor=30, armor_toughness=20,
#                   attack_damage=2048, max_absorption=2048, movement_speed=1024
#
# 注意: クライアント側は依然 1024 等でクランプして表示するため、体力バー系の MOD が
#       「現在HP/1024」のように見えることがあります(サーバー上の挙動は正しく解放後の値)。
caps:
  max_health: 100000
  armor: 1000
  armor_toughness: 1000
  # 必要なら他のバニラ属性も追記できます(例):
  # attack_damage: 1000000
  # max_absorption: 1000000
  # movement_speed: 1024

# ─────────────────────────────────────────────────────────────────────
# 防御力の上限超過分をダメージ軽減へ変換
# ─────────────────────────────────────────────────────────────────────
# バニラの防具式は防御 100 で軽減 80% に頭打ちし、それ以上の防御値は無意味になります。
# その「死に値」を乗算ダメージ軽減として活かし、上限解放した防御を最後まで効かせます。
#   追加軽減 = min(max-reduction, (実効防御 − threshold) × reduction-per-point)
# 防具計算後のダメージにさらに ×(1 − 追加軽減) を掛けます。armor_penetration で実効防御が
# threshold を割れば、この追加軽減も自動的に消えます(貫通と無矛盾)。
armor-overflow:
  enabled: true
  # この防御値を超えた分が軽減に変換される(バニラ式が 80% に達する点)
  threshold: 100
  # 超過防御 1 ポイントあたりの追加軽減(0.008 = バニラ armor/5 枝と同率)
  reduction-per-point: 0.008
  # 追加軽減の上限(1.0 未満。完全無敵化を防ぐ)
  max-reduction: 0.95
